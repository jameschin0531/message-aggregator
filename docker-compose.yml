# Local stack: Postgres + API (serves the inbox on :3000) + triage worker.
#   cp .env.example .env    # then edit
#   docker compose up --build
#   docker compose exec api npm run seed   # optional synthetic demo data
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: triage
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 20

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/triage
    ports: ["3000:3000"]
    depends_on:
      db: { condition: service_healthy }

  worker:
    build: .
    command: ["npm", "run", "worker:prod"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/triage
    depends_on:
      api: { condition: service_started } # the API runs migrations on start

volumes:
  pgdata:
